<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- School building shape -->
  <rect x="20" y="40" width="60" height="50" fill="#3B82F6" />
  
  <!-- Roof -->
  <polygon points="10,40 50,10 90,40" fill="#1E40AF" />
  
  <!-- Door -->
  <rect x="40" y="65" width="20" height="25" fill="#FFFFFF" />
  
  <!-- Windows -->
  <rect x="25" y="50" width="10" height="10" fill="#FFFFFF" />
  <rect x="65" y="50" width="10" height="10" fill="#FFFFFF" />
  
  <!-- Text -->
  <text x="50" y="95" font-family="Arial" font-size="10" text-anchor="middle" fill="#FFFFFF">SCHOOL</text>
</svg>
